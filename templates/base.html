<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five Flowers QR</title><style>:root{--pink:#e98db1;--dark:#a93f68;--soft:#fff0f6;--text:#553546}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff9fb,#f8e2ec);color:var(--text)}nav{padding:18px 5%;background:#fff;display:flex;justify-content:space-between;box-shadow:0 4px 20px #8b2f5420}nav a{text-decoration:none;color:var(--dark);font-weight:700}.wrap{width:min(940px,92%);margin:34px auto}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 34px #7e2f4c1b;margin-bottom:20px}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--pink);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.btn.alt{background:#fff;color:var(--dark);border:1px solid var(--pink)}input{width:100%;padding:14px;border:1px solid #eab4c8;border-radius:12px;margin:10px 0 16px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #f2d9e3;text-align:left}th{background:var(--soft)}.yes{color:#be304b;font-weight:700}.no{color:#278254;font-weight:700}</style></head><body><nav><a href="/">🌸 Five Flowers QR</a>{% if session.get("admin") %}<a href="/logout">Logout</a>{% endif %}</nav><div class="wrap">{% block content %}{% endblock %}</div></body></html>
