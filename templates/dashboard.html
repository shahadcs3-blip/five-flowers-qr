{% extends "base.html" %}{% block content %}<div class="card"><h1>QR Codes 71–82</h1><p>Each QR code works once only.</p><a class="btn" href="/download">Download QR Codes</a> <form method="post" action="/reset-all" style="display:inline" onsubmit="return confirm('Reset all codes?')"><button class="btn alt">Reset All</button></form></div><div class="card" style="overflow:auto"><table><tr><th>Number</th><th>Status</th><th>First scan</th><th>Action</th></tr>{% for number, used, first_used_at in rows %}<tr><td><strong>{{ number }}</strong></td><td class="{{ 'yes' if used else 'no' }}">{{ 'Already scanned' if used else 'Unused' }}</td><td>{{ first_used_at or '—' }}</td><td><form method="post" action="/reset/{{ number }}"><button class="btn alt">Reset</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
